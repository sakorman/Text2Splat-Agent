<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f8fa" />
    <title>Text2Splat Agent · 造物方舟</title>
    <meta
      name="description"
      content="聊想法、问问题，也能把描述变成 3D 模型。"
    />
    <link rel="stylesheet" href="./studio.css" />
    <script type="module" src="./studio.js"></script>
  </head>
  <body>
    <header class="masthead">
      <span class="brand">造物方舟</span>
      <span class="brand-note">Text2Splat Agent</span>
    </header>
    <main class="workspace">
      <section class="compose" aria-labelledby="page-title">
        <h1 id="page-title">让想法立起来</h1>
        <p class="intro">聊想法、问问题，准备好了再开始创造。</p>
      </section>

      <section id="conversation" class="conversation" aria-label="对话" role="log" aria-live="polite" hidden></section>

      <section
        class="progress"
        id="progress-panel"
        hidden
        aria-label="生成进度"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="progress-mark" aria-hidden="true"></span>
        <div class="progress-copy">
          <h2 id="progress-title"></h2>
          <p id="progress-message"></p>
          <p id="stream-note" hidden></p>
        </div>
        <button id="cancel-button" class="text-button" type="button">
          取消生成
        </button>
      </section>

      <section class="composer" aria-label="发送消息">
        <form id="create-form">
          <label class="sr-only" for="prompt">输入消息</label>
          <div class="prompt-box">
            <textarea
              id="prompt"
              name="prompt"
              minlength="1"
              maxlength="2000"
              required
              rows="3"
              placeholder="聊聊你的想法，或告诉我：生成一个浅青色釉面的陶瓷小鸟。"
            ></textarea>
            <div class="form-actions">
              <button class="primary" id="create-button" type="submit">
                发送
              </button>
            </div>
          </div>
          <p class="form-error" id="form-error" role="alert" hidden></p>
        </form>
      </section>

      <section class="result" id="result" hidden aria-label="生成的 3D 模型">
        <iframe
          id="viewer"
          title="3D 模型，可拖动旋转"
          allow="fullscreen"
          hidden
        ></iframe>
        <div class="result-footer">
          <p>拖动旋转，滚动缩放</p>
          <div id="result-actions" class="result-actions"></div>
        </div>
      </section>

    </main>
  </body>
</html>
