[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "text2splat-agent"
version = "0.2.0"
description = "Local text-to-3D agent built with LangGraph, LangChain and MCP"
requires-python = ">=3.11"
dependencies = [
  "graphics-agent-mcp>=0.1,<0.2",
  "langchain==1.4.7",
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "fastapi==0.162.0",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
text2splat-agent = "text2splat.app:main"

[tool.setuptools.packages.find]
include = ["text2splat*"]

[tool.setuptools.package-data]
text2splat = ["static/graphics/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
