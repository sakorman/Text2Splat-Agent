<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f8fa" />
    <title>Text2Splat Agent · 造物方舟</title>
    <meta
      name="description"
      content="输入一段描述，生成可以旋转查看的 3D 模型。"
    />
    <link rel="stylesheet" href="./studio.css" />
    <script type="module" src="./studio.js"></script>
  </head>
  <body>
    <header class="masthead">
      <span class="brand">造物方舟</span>
      <span class="brand-note">Text2Splat Agent</span>
    </header>
    <main class="workspace">
      <section class="compose" aria-labelledby="page-title">
        <h1 id="page-title">让想法立起来</h1>
        <p class="intro">输入一段描述，生成一个 3D 模型。</p>
        <form id="create-form">
          <label class="sr-only" for="prompt">描述你想生成的物件</label>
          <div class="prompt-box">
            <textarea
              id="prompt"
              name="prompt"
              minlength="2"
              maxlength="2000"
              required
              rows="5"
              placeholder="描述你想生成的物件，比如：一只圆润的青瓷小鸟，浅青色釉面，翅膀带有细密的羽纹。"
            ></textarea>
            <div class="form-actions">
              <button class="primary" id="create-button" type="submit">
                生成 3D 模型
              </button>
            </div>
          </div>
          <p class="form-error" id="form-error" role="alert" hidden></p>
        </form>
      </section>

      <section
        class="progress"
        id="progress-panel"
        hidden
        aria-label="生成进度"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="progress-mark" aria-hidden="true"></span>
        <div class="progress-copy">
          <h2 id="progress-title"></h2>
          <p id="progress-message"></p>
          <p id="stream-note" hidden></p>
        </div>
        <button id="cancel-button" class="text-button" type="button">
          取消生成
        </button>
      </section>

      <section class="result" id="result" hidden aria-label="生成的 3D 模型">
        <iframe
          id="viewer"
          title="3D 模型，可拖动旋转"
          allow="fullscreen"
          hidden
        ></iframe>
        <div class="result-footer">
          <p>拖动旋转，滚动缩放</p>
          <div id="result-actions" class="result-actions"></div>
        </div>
      </section>
    </main>
  </body>
</html>
