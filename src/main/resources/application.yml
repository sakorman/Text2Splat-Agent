spring:
  application:
    name: SpringAI-Agent
  ai:
    openai:
      base-url: ${CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${CHAT_API_KEY:not-configured}
      chat:
        options:
          model: ${CHAT_MODEL:deepseek-chat}
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:deepseek-r1:7b}
    mcp:
      client:
        enabled: false
    vectorstore:
      redis:
        initialize-schema: true
        prefix: "doc:"
        index-name: spring_ai_index
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${PORT:8080}
logging:
  level:
    org.springframework.ai: info
    com.lucius.springaitest: info
